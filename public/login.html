<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #e8f5e9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #1a5d7a; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="admin@lifemed.com" value="admin@lifemed.com">
        <input type="password" id="password" placeholder="admin123" value="admin123">
        <button onclick="login()">Login</button>
        <div id="error" class="error"></div>
    </div>
    <script>
        const API = 'https://lifemed-healthcare.onrender.com/api';
        async function login() {
            let res = await fetch(API+'/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            let data = await res.json();
            if(data.success) {
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error').innerText = 'Invalid credentials';
            }
        }
    </script>
</body>
</html>
