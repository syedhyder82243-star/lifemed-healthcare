<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - LifeMed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #e8f5e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #1a5d7a; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #1a5d7a; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 16px; }
        button:hover { background: #2e7d64; }
        .error { color: red; margin-top: 10px; }
        .logo { font-size: 24px; font-weight: bold; color: #1a5d7a; margin-bottom: 20px; }
        .logo span { color: #ffd700; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">LifeMed <span>Health Care</span></div>
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email" value="admin@lifemed.com">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="login()">Login</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        const API = 'https://lifemed-healthcare.onrender.com/api';
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminRole', data.role);
                window.location.href = '/admin.html';
            } else {
                document.getElementById('errorMsg').innerText = data.message || 'Login failed';
            }
        }
    </script>
</body>
</html>
